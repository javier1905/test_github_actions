name: CI/CD Test
run-name: Deployment Test

on:
  pull_request:
    types: [closed]
    branches:
      - staging
    paths-ignore:
      - "README.md"

jobs:
  ci:
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Show versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run eslint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

  cd:
    runs-on: ubuntu-24.04
    environment: staging
    needs: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: Dockerfile
          push: true
          build-args: |
            NODE_VERSION=26
          tags: ghcr.io/${{ github.repository_owner }}/frontend:0.0.1

name: CI/CD Test
run-name: Deployment Test

on:
    pull_request:
        types: [closed]
        branches:
            - staging
        paths-ignore:
            - "README.md"

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Run eslint
              run: |
                  apk upgrade --no-cache
                  PNPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]") &&  npm install -g pnpm@$PNPM_VERSION
                  pnpm lint
            - name: Build Container
              run: |
                  docker compose -f docker-compose.local.yml --env-file manifest.env build

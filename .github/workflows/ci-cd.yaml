name: CI/CD Test
run-name: Deployment Test

on:
    pull_request:
        types: [closed]
        branches:
            - staging
        paths-ignore:
            - "README.md"

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: package.json
                  cache: pnpm

            - name: Show versions
              run: |
                  node --version
                  pnpm --version

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run eslint
              run: pnpm lint

            - name: Run tests
              run: pnpm test

            - name: Build Container
              run: |
                  docker compose -f docker-compose.local.yml --env-file manifest.env build
